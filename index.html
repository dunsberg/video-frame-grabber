<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>视频抽帧工具</title>
<style>
  :root { --bg:#111318; --panel:#1b1f27; --line:#2a303c; --txt:#e8eaf0; --dim:#8b93a3; --acc:#4f8cff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--txt); font:14px/1.5 "Segoe UI",system-ui,sans-serif; display:flex; flex-direction:column; overflow:hidden; }

  /* 载入区 */
  #dropzone { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    border:2px dashed var(--line); border-radius:14px; margin:18px; cursor:pointer; transition:.15s; }
  #dropzone:hover, #dropzone.over { border-color:var(--acc); background:rgba(79,140,255,.06); }
  #dropzone .icon { font-size:44px; }
  #dropzone .hint { color:var(--dim); }
  #dropzone kbd { background:#262c37; border:1px solid var(--line); border-radius:4px; padding:1px 6px; font-size:12px; }

  /* 播放器布局 */
  #player { display:none; flex-direction:column; height:100%; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; background:#000; overflow:hidden; position:relative; min-height:0; }
  video { max-width:100%; max-height:100%; }
  #panel { background:var(--panel); border-top:1px solid var(--line); padding:10px 14px; display:flex; flex-direction:column; gap:8px; }

  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  button { background:#262c37; color:var(--txt); border:1px solid var(--line); border-radius:7px;
    padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--acc); color:#fff; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  button.primary:hover { filter:brightness(1.1); }
  button.wide { min-width:52px; }
  .info { color:var(--dim); font-variant-numeric:tabular-nums; }
  .info b { color:var(--txt); font-weight:600; }
  input[type=number] { width:64px; background:#11141a; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; }
  select { background:#11141a; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; }
  #tc { font-size:15px; color:#fff; background:#11141a; border:1px solid var(--line); border-radius:6px; padding:5px 10px; font-variant-numeric:tabular-nums; }
  #seek { flex:1; min-width:200px; accent-color:var(--acc); }
  #fileName { max-width:46ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .keys { color:var(--dim); font-size:12px; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#262c37; border:1px solid var(--acc);
    padding:8px 18px; border-radius:8px; opacity:0; pointer-events:none; transition:.25s; }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<div id="dropzone">
  <div class="icon">🎬</div>
  <div><b>拖入视频文件</b>，或点击选择（mp4 / webm / mov…）</div>
  <div class="hint">全程本地解码，不联网、不上传</div>
</div>
<input type="file" id="fileInput" accept="video/*" hidden>

<div id="player">
  <div id="stage"><video id="video"></video></div>
  <div id="panel">
    <div class="row">
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span id="tc">00:00.000</span>
    </div>
    <div class="row">
      <button id="btnM10" class="wide" title="后退10帧">⏪10</button>
      <button id="btnPrev" class="wide" title="后退1帧">◀</button>
      <button id="btnPlay" class="wide" style="min-width:64px">▶ 播放</button>
      <button id="btnNext" class="wide" title="前进1帧">▶</button>
      <button id="btnP10" class="wide" title="前进10帧">10⏩</button>
      <button id="btnNew">换视频</button>
      <span style="flex:1"></span>
      <span class="info">FPS <select id="fpsSel">
        <option>23.976</option><option>24</option><option>25</option>
        <option selected>30</option><option>50</option><option>60</option>
      </select></span>
      <span class="info" id="meta">—</span>
      <button id="btnCopy">复制到剪贴板</button>
      <button id="btnSave" class="primary">📷 导出 PNG（原分辨率）</button>
    </div>
    <div class="row">
      <span class="info" id="fileName"></span>
      <span style="flex:1"></span>
      <span class="keys">空格=播放/暂停　←/→=±1帧　Shift+←/→=±10帧　,/.=±1帧</span>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), dropzone = $('dropzone'), fileInput = $('fileInput');
let objUrl = null, fileNameBase = 'frame';

/* ---------- 载入文件 ---------- */
function loadFile(file) {
  if (!file || !file.type.startsWith('video/') && !/\.(mp4|webm|mov|mkv|m4v|avi)$/i.test(file.name)) {
    toast('⚠ 请选择视频文件'); return;
  }
  if (objUrl) URL.revokeObjectURL(objUrl);
  objUrl = URL.createObjectURL(file);
  fileNameBase = file.name.replace(/\.[^.]+$/, '');
  video.src = objUrl;
  dropzone.style.display = 'none';
  $('player').style.display = 'flex';
  $('fileName').textContent = '📄 ' + file.name;
  video.addEventListener('loadedmetadata', () => {
    $('meta').innerHTML = `<b>${video.videoWidth}×${video.videoHeight}</b> · ${fmt(video.duration).slice(0,8)}`;
  }, { once: true });
}
dropzone.onclick = () => fileInput.click();
fileInput.onchange = () => loadFile(fileInput.files[0]);
document.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) dropzone.classList.remove('over'); });
document.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('over'); loadFile(e.dataTransfer.files[0]); });

/* ---------- 时间与帧操作 ---------- */
const fps = () => parseFloat($('fpsSel').value);
function fmt(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), ms = Math.round((t % 1) * 1000);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(3,'0')}`;
}
function frameNo() { return Math.round(video.currentTime * fps()); }
function step(frames) {
  const T = Math.min(Math.max(video.currentTime + frames / fps(), 0), video.duration || 0);
  if (!video.paused) video.pause();
  video.currentTime = +T.toFixed(4);
  renderTC();
}
function renderTC() {
  $('tc').textContent = `${fmt(video.currentTime)} · f${String(frameNo()).padStart(0,'0')}`;
  if (video.duration) $('seek').value = Math.round(video.currentTime / video.duration * 1000);
}
video.addEventListener('seeked', renderTC);
video.addEventListener('timeupdate', renderTC);

$('btnPrev').onclick = () => step(-1);
$('btnNext').onclick = () => step(+1);
$('btnM10').onclick  = () => step(-10);
$('btnP10').onclick  = () => step(+10);
$('btnPlay').onclick = () => video.paused ? video.play() : video.pause();
video.onplay  = () => $('btnPlay').textContent = '⏸ 暂停';
video.onpause = () => { $('btnPlay').textContent = '▶ 播放'; renderTC(); };
$('seek').oninput = e => { if (video.duration) video.currentTime = e.target.value / 1000 * video.duration; };
$('btnNew').onclick = () => { video.pause(); video.removeAttribute('src'); video.load();
  $('player').style.display = 'none'; dropzone.style.display = 'flex'; };

document.addEventListener('keydown', e => {
  if ($('player').style.display === 'none') return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); $('btnPlay').onclick(); }
  else if (k === 'ArrowLeft')  { e.preventDefault(); step(e.shiftKey ? -10 : -1); }
  else if (k === 'ArrowRight') { e.preventDefault(); step(e.shiftKey ? +10 : +1); }
  else if (k === ',') step(-1);
  else if (k === '.') step(+1);
});

/* 自动探测 FPS：播放瞬间取相邻帧 mediaTime 差值的中位数 */
let probing = false;
function probeFPS() {
  if (probing || !video.videoWidth) return;
  probing = true;
  const gaps = []; let last = null, n = 0;
  const cb = (now, meta) => {
    if (last !== null) { gaps.push(meta.mediaTime - last); }
    last = meta.mediaTime;
    if (++n < 14 && !video.paused) video.requestVideoFrameCallback(cb);
    else finish();
  };
  const finish = () => {
    video.pause(); probing = false;
    if (gaps.length < 4) return;
    gaps.sort((a,b)=>a-b);
    const med = gaps[Math.floor(gaps.length/2)];
    const est = 1 / med;
    for (const opt of $('fpsSel').options) {
      if (Math.abs(parseFloat(opt.value) - est) / est < 0.02) {
        $('fpsSel').value = opt.value;
        toast(`已探测帧率 ≈ ${opt.value} fps`);
        return;
      }
    }
  };
  video.requestVideoFrameCallback(cb);
  video.play();
}
video.addEventListener('loadedmetadata', () => setTimeout(probeFPS, 50), { once: true });

/* ---------- 导出 ---------- */
function drawCanvas() {
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;   // 原始分辨率，与窗口显示大小无关
  c.getContext('2d').drawImage(video, 0, 0);
  return c;
}
function outName() {
  return `${fileNameBase}_${fmt(video.currentTime).replace(/[:.]/g,'-')}_f${frameNo()}.png`;
}
$('btnSave').onclick = () => {
  if (!video.videoWidth) return;
  drawCanvas().toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = outName();
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast(`✅ 已导出 ${video.videoWidth}×${video.videoHeight} PNG`);
  }, 'image/png');
};
$('btnCopy').onclick = async () => {
  if (!video.videoWidth) return;
  try {
    const blob = await new Promise(r => drawCanvas().toBlob(r, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    toast('✅ 已复制到剪贴板');
  } catch { toast('⚠ 复制失败，请直接用导出按钮'); }
};

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
